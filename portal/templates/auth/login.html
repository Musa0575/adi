<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Portal Informatika</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #eef2f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            min-height: 520px;
        }

        /* Panel Kiri (Biru Gradient + Wave) */
        .left-panel {
            background: linear-gradient(135deg, #0d52bf 0%, #1a73e8 100%);
            color: white;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        /* Ornamen Wave Lengkung di Tengah */
        .left-panel::after {
            content: '';
            position: absolute;
            top: 0;
            right: -40px;
            bottom: 0;
            width: 80px;
            background: #ffffff;
            border-radius: 50% 0 0 50% / 50% 0 0 50%;
            z-index: 2;
        }

        .brand-icon {
            width: 80px;
            height: 80px;
            background: white;
            color: #1a73e8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 15px auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        /* Panel Kanan (Form Line-Style) */
        .right-panel {
            padding: 50px 40px;
            position: relative;
            z-index: 3;
            background: #ffffff;
        }

        .custom-line-input {
            border: none;
            border-bottom: 2px solid #38bdf8;
            border-radius: 0;
            padding: 8px 0;
            background: transparent;
            box-shadow: none !important;
            font-size: 0.95rem;
        }

        .custom-line-input:focus {
            border-bottom-color: #0d52bf;
        }

        .form-label {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }

        .btn-signin {
            background: linear-gradient(135deg, #1a73e8 0%, #0d52bf 100%);
            border: none;
            border-radius: 25px;
            padding: 10px 35px;
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.4);
            transition: all 0.3s ease;
        }

        .btn-signin:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(26, 115, 232, 0.6);
            color: white;
        }

        .btn-signup-outline {
            border: 1.5px solid #cbd5e1;
            border-radius: 25px;
            padding: 10px 30px;
            color: #64748b;
            font-weight: 600;
            background: transparent;
            text-decoration: none;
        }

        .btn-signup-outline:hover {
            border-color: #1a73e8;
            color: #1a73e8;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="row g-0 h-100">
            
            <!-- PANEL KIRI (BIRU GRADIENT) -->
            <div class="col-md-5 left-panel text-center">
                <div class="my-auto">
                    <h2 class="fw-bold mb-4">Welcome to</h2>
                    <div class="brand-icon">
                        <i class="fa-solid fa-rocket"></i>
                    </div>
                    <h3 class="fw-bold mb-3">Spacer</h3>
                    <p class="small text-white-50 px-3" style="line-height: 1.6;">
                        Portal Admin Pembelajaran Informatika SMA. Silakan login untuk mengelola berita, jadwal kelas, dan kuis.
                    </p>
                </div>
                <div class="small text-white-50 mt-4">
                    <span>CREATOR HERE</span> &nbsp;|&nbsp; <span>DESIGNER HERE</span>
                </div>
            </div>

            <!-- PANEL KANAN (FORM LOGIN) -->
            <div class="col-md-7 right-panel d-flex flex-column justify-content-center">
                <h3 class="fw-bold text-dark mb-4 ms-2">Masuk ke Akun Admin</h3>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger py-2 small mb-3">
                            <i class="fa-solid fa-circle-exclamation me-1"></i> {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    
                    <!-- Input Username -->
                    <div class="mb-4 position-relative">
                        <label class="form-label">User ID / Username</label>
                        <input type="text" name="username" class="form-control custom-line-input" placeholder="Masukkan username admin..." required autocomplete="off">
                        <i class="fa-solid fa-check text-info position-absolute end-0 bottom-0 mb-2" style="font-size: 0.8rem;"></i>
                    </div>

                    <!-- Input Password -->
                    <div class="mb-4 position-relative">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control custom-line-input" placeholder="Masukkan password..." required>
                        <i class="fa-solid fa-check text-info position-absolute end-0 bottom-0 mb-2" style="font-size: 0.8rem;"></i>
                    </div>

                    <!-- Checkbox Ingat Saya -->
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="termsCheck" checked>
                        <label class="form-check-label small text-muted" for="termsCheck">
                            Dengan masuk, Anda menyetujui <a href="#" class="text-decoration-none">Syarat & Ketentuan</a>.
                        </label>
                    </div>

                    <!-- Tombol Aksi -->
                    <div class="d-flex align-items-center gap-3">
                        <button type="submit" class="btn btn-signin">
                            Sign In <i class="fa-solid fa-arrow-right ms-1"></i>
                        </button>
                        <a href="{% url 'frontend_home' %}" class="btn btn-signup-outline">
                            Kembali
                        </a>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
